<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolySEA | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e6dccd;
        --card: #f8f2e8;
        --ink: #33281e;
        --muted: #726455;
        --line: #ccb89d;
        --accent: #7f5f42;
        --accent-ink: #fff8ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 0%, #f0e8dc 0%, var(--bg) 100%);
        font-family: "Source Sans 3", sans-serif;
        color: var(--ink);
      }
      .card {
        width: min(420px, 92vw);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 16px 36px rgba(46, 33, 21, 0.16);
      }
      h1 {
        margin: 0 0 4px;
        font-family: "Cormorant Garamond", serif;
        font-size: 2.1rem;
      }
      .sub {
        margin: 0 0 14px;
        color: var(--muted);
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .tab {
        flex: 1;
        border: 1px solid var(--line);
        background: #f1e7d7;
        color: var(--ink);
        border-radius: 10px;
        padding: 9px 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .tab.active {
        background: var(--accent);
        color: var(--accent-ink);
      }
      label {
        display: block;
        margin: 10px 0 5px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: #fffaf2;
        color: var(--ink);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }
      .inline-row {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .inline-row input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      .inline-row label {
        margin: 0;
        font-size: 0.88rem;
      }
      .hidden {
        display: none;
      }
      button[type="submit"] {
        width: 100%;
        margin-top: 14px;
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        background: linear-gradient(180deg, #86664a 0%, #6f533c 100%);
        color: #fff8ef;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        min-height: 20px;
        margin-top: 10px;
        color: #9b3028;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>PolySEA</h1>
      <p class="sub">Login to continue your learning chat.</p>

      <div class="tabs">
        <button id="loginTab" class="tab active" type="button">Login</button>
        <button id="registerTab" class="tab" type="button">Create Account</button>
      </div>

      <form id="authForm">
        <label for="emailInput">Username</label>
        <input id="emailInput" type="text" autocomplete="username" required />

        <label for="passwordInput">Password</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required />

        <div id="confirmWrap" class="hidden">
          <label for="confirmPasswordInput">Confirm Password</label>
          <input id="confirmPasswordInput" type="password" autocomplete="new-password" />
        </div>

        <div class="inline-row">
          <input id="showPasswordCheckbox" type="checkbox" />
          <label for="showPasswordCheckbox">Show password</label>
        </div>

        <div class="inline-row">
          <input id="rememberCheckbox" type="checkbox" checked />
          <label for="rememberCheckbox">Remember me</label>
        </div>

        <button type="submit" id="submitBtn">Login</button>
      </form>

      <p id="errorText" class="error"></p>
    </main>
    <script src="login.js"></script>
  </body>
</html>
