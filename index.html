<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolySEA AI | Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout-shell">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="sidebar-brand">
            <span class="brand-badge">SEA</span>
            <div>
              <strong>PolySEA</strong>
              <p>Language Studio</p>
            </div>
          </div>
          <p class="sidebar-note">Practice Thai, Vietnamese, Indonesian, and Filipino with an earthy, calm chat flow.</p>
        </div>
        <div class="sidebar-foot">AI Tutor</div>
      </aside>

      <main class="app-shell">
        <header class="chat-header">
          <div class="logo-mark" aria-hidden="true">SEA</div>
          <div>
            <h1>PolySEA AI</h1>
            <p>Your Southeast Asian Language Companion</p>
          </div>
        </header>

        <div id="chatContainer" class="chat-container">
          <div id="welcomeMessage" class="welcome-message">
            <h2>Hello, Traveler.</h2>
            <p>I can help you learn Thai, Vietnamese, Indonesian, or Filipino.</p>
          </div>
          <div id="messagesArea" class="messages-area"></div>
        </div>

        <div class="input-container">
          <div class="input-wrapper">
            <input type="text" id="chatInput" placeholder="Ask me how to say 'Hello' in Thai..." autocomplete="off" />
            <button id="sendBtn" aria-label="Send message">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="content.js"></script>
    <script src="home.js"></script>
  </body>
</html>
