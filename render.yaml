# Render service manifest for PolySEA backend
#
# Notes:
# - This manifest defines a Web Service that installs requirements and runs gunicorn.
# - Do NOT include secrets here. Set GROQ_API_KEY and APP_SECRET_KEY in Render's dashboard
#   under Environment -> Environment Variables after creating the service.

services:
  - type: web
    name: polysea-backend
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 3
    autoDeploy: true
    # Optionally set instances or region here
    # instanceCount: 1
    # region: oregon
